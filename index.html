<style>
/* Glass Ticker v3.4 — "Carbon" design system: flat charcoal surfaces, mint signal colour, mono numerics, one icon family */
*{box-sizing:border-box;margin:0}
:root{--a:#5eeaa8;--g:#5eeaa8;--r:#ff7a6b;--bg:#0c0d0e;--c1:#141516;--c2:#1a1b1d;--c3:#232528;--line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.13);--ink:#ececee;--muted:#8b8f96;--dim:#5f636a;--m:var(--muted);--sw:300px;

html,body{height:100%;overflow:hidden}
body{font:12.5px/1.4 var(--sans);color:var(--ink);background:radial-gradient(70% 45% at 85% -14%,color-mix(in srgb,var(--a) 8%,transparent),transparent 70%),var(--bg);display:flex;flex-direction:column;user-select:none;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;transition:background .4s,color .3s}

.tab.active::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--a);margin-right:7px;vertical-align:1px;box-shadow:0 0 8px var(--a)}
.gb{display:flex;align-items:center;gap:7px;height:30px;padding:0 11px;border-radius:9px;border:1px solid var(--line2);color:var(--muted);font-size:11.5px;font-weight:550}
.gb:hover{color:var(--ink);background:var(--c1)}.gb .i{width:14px;height:14px}#addtab{margin-left:auto}
/* layout */
#main{flex:1;display:flex;min-height:0;padding:0 14px 12px}
#lw{width:var(--sw);min-width:240px;display:flex;flex-direction:column;min-height:0}
.ch{display:flex;align-items:center;gap:10px;padding:13px 14px 10px}
.ch b{display:block;font-size:12.5px;font-weight:620}.ch small{display:block;font:400 9.5px var(--mono);color:var(--dim);margin-top:1px}
#list{flex:1;overflow:auto;padding:2px 8px 8px}

#sp:hover::after,#sp.d::after{height:56px;background:var(--a)}
.solo #det,.solo #sp{display:none}.solo #lw{width:100%}
/* watchlist rows */
.row{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 64px auto;gap:10px;align-items:center;padding:9px 10px 9px 18px;margin:1px 0;border-radius:11px;cursor:pointer;border:1px solid transparent;transition:background .2s,border-color .2s}
.row:hover{background:var(--c2)}.row.sel{background:var(--c3);border-color:var(--line)}
.row.sel::before{content:"";position:absolute;left:6px;top:17px;bottom:17px;width:2px;border-radius:2px;background:var(--a);box-shadow:0 0 10px var(--a)}
.identity{display:flex;align-items:center;gap:10px;min-width:0}.identity>div{min-width:0}
.row b{font:600 12px var(--mono);letter-spacing:-.01em}
.sub{color:var(--muted);font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px;margin-top:1px}
.pr{text-align:right;font-family:var(--mono)}.pr b{font-size:11.5px;display:block}.pr div{font:500 10px var(--mono);margin-top:2px;display:flex;justify-content:flex-end;align-items:center}
.sg{stroke:var(--g)}.sr{stroke:var(--r)}
.grip{position:absolute;left:3px;top:50%;transform:translateY(-50%);color:var(--dim);opacity:0;cursor:grab;transition:opacity .2s}.grip .i{width:12px;height:12px;fill:currentColor;stroke:none}.row:hover .grip{opacity:1}
.x{position:absolute;right:5px;top:5px;opacity:0;width:18px;height:18px;display:grid;place-items:center;border-radius:6px;color:var(--muted)}.x .i{width:11px;height:11px;pointer-events:none}.row:hover .x{opacity:1}.x:hover{background:var(--c1);color:var(--r)}
.row.dragging{opacity:.4}.row.drop-target{border-color:var(--a);background:color-mix(in srgb,var(--a) 10%,transparent)}
@keyframes fu{0%{background:color-mix(in srgb,var(--g) 24%,transparent)}100%{background:transparent}}

.fu{animation:fu 1.3s ease-out}.fd{animation:fd 1.3s ease-out}

#px.tkU{animation:tkU 1s ease-out}#px.tkD{animation:tkD 1s ease-out}
#chg{font:600 12px var(--mono);text-align:right}
#chg span{display:inline-flex;align-items:center;padding:6px 11px;border-radius:9px;background:color-mix(in srgb,currentColor 12%,transparent)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:14px 0 10px;flex-wrap:wrap}
#rg,#tl{display:flex;gap:2px;padding:3px;background:var(--c2);border:1px solid var(--line);border-radius:10px}

#cw{flex:1;min-height:140px;position:relative;border:1px solid var(--line);border-radius:14px;background:var(--c2) radial-gradient(var(--line) 1px,transparent 1px) 0 0/18px 18px;overflow:hidden}

.ni{padding:10px 12px;border-radius:9px;cursor:pointer;font-size:12px;line-height:1.45}.ni:hover{background:var(--c3)}.ni small{color:var(--dim);font:400 10px var(--mono)}
#floatChart{position:absolute;z-index:8;right:10px;top:10px;display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:8px;border:1px solid var(--line2);background:color-mix(in srgb,var(--c1) 86%,transparent);backdrop-filter:blur(10px);font:500 10px var(--mono);color:var(--muted);cursor:grab;opacity:.85}

#st div{background:var(--c2);padding:9px 12px;font:500 11.5px var(--mono);transition:background .2s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#st div:hover{background:var(--c3)}

.sl{display:flex;align-items:center;gap:10px}.sl output{font:500 10.5px var(--mono);color:var(--a);min-width:34px;text-align:right}

#sws{display:flex;gap:6px;align-items:center}

.kh{font:400 9.5px var(--mono);color:var(--dim);padding:9px 14px 6px;border-top:1px solid var(--line)}

#tickerstrip{display:none;gap:8px;padding:4px 16px 12px;overflow-x:auto;scrollbar-width:none;flex:1;align-items:flex-start}
.tickitem{display:flex;align-items:center;gap:9px;padding:7px 12px 7px 8px;border-radius:12px;background:var(--c1);border:1px solid var(--line);cursor:pointer;white-space:nowrap;transition:transform .35s var(--spring),border-color .2s}

const rsi=(p,n=14)=>{if(p.length<=n)return null;let g=0,l=0;for(let i=1;i<=n;i++){const d=p[i]-p[i-1];d>0?g+=d:l-=d}g/=n;l/=n;for(let i=n+1;i<p.length;i++){const d=p[i]-p[i-1];g=(g*(n-1)+Math.max(d,0))/n;l=(l*(n-1)+Math.max(-d,0))/n}return l?100-100/(1+g/l):100};

const logoCache=(()=>{try{return JSON.parse(localStorage.getItem('st_logo_cache')||'{}')}catch{return {}}})();

function symbolLabel(s){return s.replace(/\.(NS|BO)$/,'').replace(/^\^/,'');}
function logoFallback(s){const label=symbolLabel(s).slice(0,3).toUpperCase();return `<span class="company-logo logo-fallback" aria-label="${esc(label)}">${esc(label)}</span>`}

function logoMarkup(s,small=false){
 const cached=logoCache[s],known=LOGO_DOMAINS[s];
 if(!cached||Date.now()-cached.at>=LOGO_TTL)resolveLogo(s);

function normalizedTicker(s){return String(s||'').toUpperCase().replace(/\.(NS|BO)$/,'').replace(/[^A-Z0-9^=-]/g,'')}
async function resolveLogo(s){
 if(logoPending.has(s))return;
 const old=logoCache[s];if(old&&Date.now()-old.at<LOGO_TTL)return;
 logoPending.add(s);
 try{
  let image='',domain=LOGO_DOMAINS[s]||'';
  // Yahoo search resolves a ticker to the corresponding issuer/security record.
  const search=await api.get(`https://query1.finance.yahoo.com/v1/finance/search?q=${encodeURIComponent(symbolLabel(s))}&quotesCount=8&newsCount=0&listsCount=0`);
  const quotes=Array.isArray(search?.quotes)?search.quotes:[];
  const match=quotes.find(x=>normalizedTicker(x.symbol)===normalizedTicker(s)) ||
    quotes.find(x=>normalizedTicker(x.symbol)===normalizedTicker(symbolLabel(s)) && ['EQUITY','ETF','CRYPTOCURRENCY'].includes(x.quoteType));
  if(match){
    image=safeLogoUrl(match.logoUrl||match.companyLogoUrl||'');
    if(!image){
      try{
        const q=await api.get(`https://query1.finance.yahoo.com/v7/finance/quote?symbols=${encodeURIComponent(match.symbol)}&fields=logoUrl,companyLogoUrl,website`);
        const item=q?.quoteResponse?.result?.[0];
        image=safeLogoUrl(item?.logoUrl||item?.companyLogoUrl||'');
        if(!domain&&item?.website){try{domain=new URL(item.website.startsWith('http')?item.website:`https://${item.website}`).hostname.replace(/^www\./,'')}catch{}}
      }catch{}
    }

  }
  // The issuer's own domain is a useful logo source when Yahoo has no logo asset.
  if(!image&&domain)image=`https://www.google.com/s2/favicons?domain=${encodeURIComponent(domain)}&sz=128`;
  logoCache[s]={url:safeLogoUrl(image),at:Date.now(),domain:domain||''};persistLogoCache();

 }catch(e){logoCache[s]={url:'',at:Date.now()};persistLogoCache()}
 finally{logoPending.delete(s)}
}

async function q(s,r,i){const j=await api.get(`${base}v8/finance/chart/${encodeURIComponent(s)}?range=${r}&interval=${i}`);const x=j.chart.result[0],c=x.indicators.quote[0],t=[],p=[],o=[],h=[],l=[],vv=[];

  const ch=d.price-d.prev,pc=ch/d.prev*100,up=ch>=0;

const PAD={l:8,r:70,t:12,b:22};
function geo(w,h){const a=C.h||C.p,b=C.l||C.p;let hi=Math.max(...a),lo=Math.min(...b);const sp=(hi-lo)||1;lo-=sp*.1;hi+=sp*.1;const n=C.p.length,ch=h-PAD.t-PAD.b,vh=ch*.16;
 return{lo,hi,vh,bw:(w-PAD.l-PAD.r)/n,X:i=>PAD.l+(w-PAD.l-PAD.r)*(i+.5)/n,Y:v=>PAD.t+(ch-vh)*(1-(v-lo)/(hi-lo))}}
function draw(){const cv=$('#cv'),dpr=devicePixelRatio,w=cv.clientWidth,h=cv.clientHeight;cv.width=w*dpr;cv.height=h*dpr;
 const x=cv.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);const p=C.p;if(p.length<2)return;
 const {lo,hi,X,Y,vh,bw}=geo(w,h),n=p.length,ref=S.range==='1D'?C.m.chartPreviousClose:p[0],up=p[n-1]>=ref,col=up?UPc():DNc(),cd=S.type==='candle',bot=h-PAD.b,cur=C.m.currency;
 x.font='10px JetBrains Mono,Cascadia Mono,Consolas,monospace';x.lineWidth=1;
 for(let k=0;k<5;k++){const v=lo+(hi-lo)*k/4,y=Y(v);x.strokeStyle=`rgba(${INK()},.06)`;x.beginPath();x.moveTo(PAD.l,y);x.lineTo(w-PAD.r,y);x.stroke();x.fillStyle=`rgba(${INK()},.45)`;x.fillText(v.toFixed(2),w-PAD.r+6,y+4)}
 for(let k=0;k<4;k++){const i=Math.round((n-1)*k/3);x.fillStyle=`rgba(${INK()},.4)`;x.textAlign=k==3?'right':k?'center':'left';x.fillText(fmtT(C.t[i]),X(i),h-6)}x.textAlign='left';
 x.save();x.beginPath();x.rect(0,0,PAD.l+(w-PAD.l-PAD.r)*anim+1,h);x.clip();
 const mv=Math.max(...C.v,1);C.v.forEach((v,i)=>{x.fillStyle=p[i]>=C.o[i]?`rgba(${UPc()},.2)`:`rgba(${DNc()},.2)`;const b=v/mv*vh;x.fillRect(X(i)-bw*.35,bot-b,Math.max(1,bw*.7),b)});
 if(cd){C.p.forEach((c,i)=>{const u=c>=C.o[i];x.strokeStyle=x.fillStyle=u?`rgb(${UPc()})`:`rgb(${DNc()})`;x.beginPath();x.moveTo(X(i),Y(C.h[i]));x.lineTo(X(i),Y(C.l[i]));x.stroke();const t=Y(Math.max(c,C.o[i]));x.fillRect(X(i)-bw*.32,t,Math.max(1,bw*.64),Math.max(1,Y(Math.min(c,C.o[i]))-t))})}
 else{x.beginPath();p.forEach((v,i)=>i?x.lineTo(X(i),Y(v)):x.moveTo(X(i),Y(v)));x.strokeStyle=`rgb(${col})`;x.lineWidth=2;x.lineJoin='round';x.shadowColor=`rgba(${col},.6)`;x.shadowBlur=10;x.stroke();x.shadowBlur=0;
  x.lineTo(X(n-1),bot);x.lineTo(X(0),bot);const g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,`rgba(${col},.35)`);g.addColorStop(1,`rgba(${col},0)`);x.fillStyle=g;x.fill()}
 if(S.sma){const m=sma(p,Math.min(20,n>>1||1));x.beginPath();let f=1;m.forEach((v,i)=>{if(v==null)return;f?x.moveTo(X(i),Y(v)):x.lineTo(X(i),Y(v));f=0});x.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--a');x.lineWidth=1.5;x.stroke()}
 x.restore();
 if(S.range==='1D'&&ref>lo&&ref<hi){x.strokeStyle=`rgba(${INK()},.25)`;x.setLineDash([2,5]);x.beginPath();x.moveTo(PAD.l,Y(ref));x.lineTo(w-PAD.r,Y(ref));x.stroke();x.setLineDash([])}
 if(hov>=0&&hov<n){const px=X(hov),py=Y(p[hov]);x.strokeStyle=`rgba(${INK()},.3)`;x.setLineDash([4,4]);x.beginPath();x.moveTo(px,PAD.t);x.lineTo(px,bot);x.stroke();x.setLineDash([]);
  x.fillStyle=`rgb(${col})`;x.beginPath();x.arc(px,py,4.5,0,7);x.fill();const f=v=>nf(v,cur),
  tx=(cd?`O ${f(C.o[hov])}  H ${f(C.h[hov])}  L ${f(C.l[hov])}  C ${f(p[hov])}`:f(p[hov]))+'   '+fmtT(C.t[hov]),tw=x.measureText(tx).width+18,bx=Math.min(Math.max(px-tw/2,PAD.l),w-PAD.r-tw);
  x.fillStyle=LT()?'rgba(255,255,255,.97)':'rgba(8,9,10,.94)';x.beginPath();x.roundRect(bx,PAD.t,tw,24,8);x.fill();x.strokeStyle=`rgba(${INK()},.14)`;x.stroke();x.fillStyle=LT()?'#18191b':'#f2f2f3';x.fillText(tx,bx+9,PAD.t+16)}}
$('#cv').onmousemove=e=>{const w=$('#cv').clientWidth,n=C.p.length;if(n<2)return;hov=Math.max(0,Math.min(n-1,Math.floor((e.offsetX-PAD.l)/(w-PAD.l-PAD.r)*n)));draw()};
$('#cv').onmouseleave=()=>{hov=-1;draw()};new ResizeObserver(draw).observe($('#cw'));
function showAlert(){const a=S.alerts[S.sel],p=S.pctAlerts[S.sel];$('#at').textContent=a?`Price: ${a.dir>0?'rises to':'falls to'} ${a.px}`:p?`Move: ${p.dir==='up'?'+':'−'}${p.pct}%`:'No active alert'}
$('#alertmode').onchange=()=>{const pct=$('#alertmode').value==='percent';$('#al').style.display=pct?'none':'inline-block';$('#pctalert').style.display=pct?'inline-block':'none';$('#alertdir').style.display=pct?'inline-block':'none'};
$('#as').onclick=()=>{const d=D[S.sel];if(!d)return;if($('#alertmode').value==='percent'){const pct=Math.abs(parseFloat($('#pctalert').value));if(!pct)return;S.pctAlerts[S.sel]={pct,dir:$('#alertdir').value,base:d.price};}else{const v=parseFloat($('#al').value);if(!v)return;S.alerts[S.sel]={px:v,dir:v>d.price?1:-1};}save();$('#al').value='';$('#pctalert').value='';showAlert()};
function checkAlerts(){for(const s in S.alerts){const a=S.alerts[s],d=D[s];if(d&&(a.dir>0?d.price>=a.px:d.price<=a.px)){new Notification('Price alert: '+s,{body:`${s} is at ${nf(d.price,d.cur)} (target ${a.px})`});delete S.alerts[s];save();showAlert()}}
for(const s in S.pctAlerts){const a=S.pctAlerts[s],d=D[s];if(d){const move=(d.price/a.base-1)*100,hit=a.dir==='up'?move>=a.pct:move<=-a.pct;if(hit){new Notification('Move alert: '+s,{body:`${s} moved ${move.toFixed(2)}%`});delete S.pctAlerts[s];save();showAlert()}}}}
let sd;const dd=$('#dd');
$('#q').oninput=e=>{clearTimeout(sd);const v=e.target.value.trim();if(!v){dd.style.display='none';return}
 sd=setTimeout(async()=>{try{const j=await api.get(`${base}v1/finance/search?q=${encodeURIComponent(v)}&quotesCount=8&newsCount=0`);
  const r=(j.quotes||[]).filter(x=>x.symbol);dd.innerHTML=r.map((x,i)=>`<div class="${i?'':'on'}" data-s="${esc(x.symbol)}"><span><b>${esc(x.symbol)}</b> ${esc(x.shortname||x.longname||'')}</span><span style="opacity:.5">${esc(x.exchDisp||'')}</span></div>`).join('')||'<div>No results</div>';dd.style.display='block'}catch(e){}},250)};
dd.onmousedown=e=>{const r=e.target.closest('[data-s]');if(r)add(r.dataset.s)};
$('#q').onkeydown=e=>{if(e.key==='Enter'){const f=dd.querySelector('[data-s]');if(f)add(f.dataset.s)}if(e.key==='Escape'){dd.style.display='none';e.target.blur()}};
$('#q').onblur=()=>setTimeout(()=>dd.style.display='none',150);
async function add(s){if(!S.list.includes(s))S.list.unshift(s);S.sel=s;syncWatchlist();save();$('#q').value='';dd.style.display='none';await poll();loadDetail(true)}
addEventListener('keydown',e=>{if(e.ctrlKey&&e.key==='m'){e.preventDefault();$('#stripbtn').click()}if(e.ctrlKey&&e.key==='k'){e.preventDefault();$('#q').focus();$('#q').select()}
 if(document.activeElement.tagName==='INPUT')return;const L=ord(),i=L.indexOf(S.sel);if(e.key==='ArrowDown'&&i<L.length-1)pick(L[i+1]);if(e.key==='ArrowUp'&&i>0)pick(L[i-1])});
let PS='',nv=false,NW={s:''};
const sgn=(v,c)=>(v>=0?'+':'−')+nf(Math.abs(v),c);
function showPos(){const h=S.hold[S.sel],d=D[S.sel];if(PS!==S.sel){PS=S.sel;$('#pq').value=h?h.q:'';$('#pc').value=h?h.c:''}
 $('#pt').innerHTML=h&&d?(()=>{const pl=h.q*(d.price-h.c);return `${nf(h.q*d.price,d.cur)} · <span class="${pl>=0?'up':'dn'}">${sgn(pl,d.cur)} (${((d.price/h.c-1)*100).toFixed(2)}%)</span>`})():''}
$('#pv').onclick=()=>{const q=parseFloat($('#pq').value),c=parseFloat($('#pc').value);if(q>0&&c>=0)S.hold[S.sel]={q,c};else delete S.hold[S.sel];save();showPos();pf()};
function pf(){const T={};for(const s in S.hold){const d=D[s],h=S.hold[s];if(!d||!S.list.includes(s))continue;const t=T[d.cur]||(T[d.cur]={v:0,day:0,pl:0});t.v+=h.q*d.price;t.day+=h.q*(d.price-d.prev);t.pl+=h.q*(d.price-h.c)}
 $('#pf').innerHTML=Object.entries(T).map(([c,t])=>`Portfolio ${nf(t.v,c)} · day <span class="${t.day>=0?'up':'dn'}">${sgn(t.day,c)}</span> · P&amp;L <span class="${t.pl>=0?'up':'dn'}">${sgn(t.pl,c)}</span>`).join(' | ')}
async function news(){if(!nv||NW.s===S.sel)return;NW.s=S.sel;const el=$('#nw');el.innerHTML='<div class="ni">Loading…</div>';try{const j=await api.get(`${base}v1/finance/search?q=${encodeURIComponent(S.sel)}&quotesCount=0&newsCount=10`);if(NW.s!==S.sel)return;
 el.innerHTML=(j.news||[]).map(n=>`<div class="ni" data-u="${esc(n.link)}">${esc(n.title)}<br><small>${esc(n.publisher||'')} · ${new Date(n.providerPublishTime*1000).toLocaleString([],{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}</small></div>`).join('')||'<div class="ni">No news found</div>'}catch{el.innerHTML='<div class="ni">Could not load news</div>';NW.s=''}}
$('#nw').onclick=e=>{const n=e.target.closest('[data-u]');n&&api.open(n.dataset.u)};

// Watchlists, reorder interactions, mini ticker and currency conversion
$('#tabs').onclick=e=>{const b=e.target.closest('[data-tab]');if(b)switchTab(+b.dataset.tab)};
$('#tabs').ondblclick=e=>{const b=e.target.closest('[data-tab]');if(!b)return;const i=+b.dataset.tab,n=prompt('Rename watchlist',S.watchlists[i].name);if(n&&n.trim()){S.watchlists[i].name=n.trim().slice(0,24);save();renderTabs()}};
$('#addtab').onclick=()=>{const n=prompt('Name this watchlist','Watchlist '+(S.watchlists.length+1));if(!n||!n.trim())return;syncWatchlist();S.watchlists.push({name:n.trim().slice(0,24),symbols:[]});switchTab(S.watchlists.length-1)};
let dragSymbol=null;
$('#list').ondragstart=e=>{const r=e.target.closest('.row');if(!r)return;dragSymbol=r.dataset.s;r.classList.add('dragging');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',dragSymbol)};
$('#list').ondragend=e=>{e.target.closest('.row')?.classList.remove('dragging');document.querySelectorAll('.drop-target').forEach(x=>x.classList.remove('drop-target'))};
$('#list').ondragover=e=>{e.preventDefault();const r=e.target.closest('.row');document.querySelectorAll('.drop-target').forEach(x=>x.classList.remove('drop-target'));if(r&&r.dataset.s!==dragSymbol)r.classList.add('drop-target')};
$('#list').ondrop=e=>{e.preventDefault();const r=e.target.closest('.row');if(!r||!dragSymbol||r.dataset.s===dragSymbol)return;const from=S.list.indexOf(dragSymbol),to=S.list.indexOf(r.dataset.s);if(from<0||to<0)return;S.list.splice(from,1);S.list.splice(to,0,dragSymbol);dragSymbol=null;syncWatchlist();renderList()};
function renderStrip(){const el=$('#tickerstrip');el.innerHTML=ord().map(s=>{const d=D[s];if(!d)return '';const pct=(d.price-d.prev)/d.prev*100,up=pct>=0;return `<div class=\"tickitem\" data-tick=\"${esc(s)}\">${logoMarkup(s)}<b>${esc(symbolLabel(s))}</b><b>${nf(d.price,d.cur)}</b><small class=\"${up?'up':'dn'}\">${tri(up)} ${Math.abs(pct).toFixed(2)}%</small></div>`}).join('')}
$('#tickerstrip').onclick=e=>{const t=e.target.closest('[data-tick]');if(t){document.body.classList.remove('ticker-mode');S.mini=false;pick(t.dataset.tick);save()}};
$('#stripbtn').onclick=()=>{S.mini=!S.mini;document.body.classList.toggle('ticker-mode',S.mini);$('#stripbtn').innerHTML=stripLbl();save();renderStrip()};
async function convertCurrency(){const d=D[S.sel];if(!d)return;const from=d.cur||'USD',to=$('#tocur').value,amount=+( $('#convertamount').value||0);$('#fromcur').textContent=from;if(from===to){$('#convertresult').textContent=nf(amount,to);return}
try{const pair=from+to+'=X',j=await api.get(`${base}v8/finance/chart/${encodeURIComponent(pair)}?range=1d&interval=1d`),rate=j.chart.result[0].meta.regularMarketPrice;$('#convertresult').textContent=nf(amount*rate,to)}catch{$('#convertresult').textContent='Unavailable'}}
$('#tocur').onchange=convertCurrency;$('#convertamount').oninput=convertCurrency;
function initUI(){const m=()=>{$('#ty').classList.toggle('on',S.type==='candle');$('#sm').classList.toggle('on',S.sma);$('#nb').classList.toggle('on',nv);$('#nw').classList.toggle('on',nv);$('#cw').classList.toggle('cv-off',nv);$('#so').title='Sort: '+['custom','% change','name'][S.sort]};
 $('#ty').onclick=()=>{S.type=S.type==='candle'?'area':'candle';save();m();draw()};$('#sm').onclick=()=>{S.sma=!S.sma;save();m();draw()};
 $('#nb').onclick=()=>{nv=!nv;NW.s='';m();news()};$('#so').onclick=()=>{S.sort=(S.sort+1)%3;save();m();renderList()};m();
 const ac=$('#ac');ac.value=S.acc;markAc();document.documentElement.style.setProperty('--a',S.acc);ac.oninput=()=>{S.acc=ac.value;markAc();document.documentElement.style.setProperty('--a',S.acc);save();draw()};
 document.body.classList.toggle('light',S.theme==='light');$('#theme').onclick=()=>{S.theme=S.theme==='light'?'dark':'light';document.body.classList.toggle('light',S.theme==='light');save();draw()};
 $('#tr').checked=S.tray;api.win('tray',S.tray);$('#tr').onchange=e=>{S.tray=e.target.checked;api.win('tray',S.tray);save()};
 $('#ex').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({list:S.list,watchlists:S.watchlists,activeWatchlist:S.activeWatchlist,hold:S.hold,alerts:S.alerts,pctAlerts:S.pctAlerts},null,1)],{type:'application/json'}));a.download='glass-ticker-backup.json';a.click()};
 $('#im').onclick=()=>$('#fi').click();
 $('#fi').onchange=async e=>{try{const j=JSON.parse(await e.target.files[0].text()),ok=v=>typeof v==='string'&&/^[\w.^=\-]{1,20}$/.test(v);
  if(Array.isArray(j.list))S.list=[...new Set(j.list.filter(ok))];if(Array.isArray(j.watchlists)&&j.watchlists.length)S.watchlists=j.watchlists.filter(w=>w&&typeof w.name==='string'&&Array.isArray(w.symbols)).map(w=>({name:w.name.slice(0,24),symbols:[...new Set(w.symbols.filter(ok))]}));if(Number.isInteger(j.activeWatchlist))S.activeWatchlist=Math.max(0,Math.min(S.watchlists.length-1,j.activeWatchlist));S.sel=S.list[0];
  for(const k in j.hold||{})if(ok(k)&&j.hold[k].q>0&&j.hold[k].c>=0)S.hold[k]={q:+j.hold[k].q,c:+j.hold[k].c};
  for(const k in j.alerts||{})if(ok(k)&&isFinite(j.alerts[k].px))S.alerts[k]={px:+j.alerts[k].px,dir:j.alerts[k].dir>0?1:-1};for(const k in j.pctAlerts||{})if(ok(k)&&isFinite(j.pctAlerts[k].pct)&&j.pctAlerts[k].base>0)S.pctAlerts[k]={pct:+j.pctAlerts[k].pct,dir:j.pctAlerts[k].dir==='up'?'up':'down',base:+j.pctAlerts[k].base};
  syncWatchlist();save();await poll();loadDetail(true)}catch{$('#upd').textContent='Invalid backup file'}e.target.value=''}}

function widgetPayload(){const d=D[S.sel];if(!d||!C.p?.length)return null;return{symbol:S.sel,name:d.name||S.sel,price:d.price,change:d.price-d.prev,pct:d.prev?(d.price-d.prev)/d.prev*100:0,currency:d.cur||'USD',points:C.p.slice(-90),updated:Date.now()}}

// Drag beyond the app edge, release on the wallpaper: create the widget at the release point and tuck the main window away.

$('#pin').classList.toggle('on',S.top);api.win('top',S.top);$('#op').value=S.op;fillOp();api.win('op',S.op/100);$('#au').checked=S.auto;markIv();

$('#floatChart').innerHTML=I('pinout')+'Pin to desktop';initUI();renderTabs();document.body.classList.toggle('ticker-mode',S.mini);$('#stripbtn').innerHTML=stripLbl();renderList();poll().then(()=>loadDetail(true));sched();
