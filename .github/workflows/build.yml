name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 20, cache: npm }
      - run: npm ci
      # Builds on Windows so rcedit can embed build/icon.ico into the exe.
      # Building on Linux skips that step and ships a generic icon.
      - run: npm run dist
      - name: Compute release metadata
        shell: pwsh
        run: |
          $exe = "dist/GlassTicker.exe"
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          $size = (Get-Item $exe).Length
          $tag = "${{ github.ref_name }}"
          if ($tag -like "v*") { $version = $tag.TrimStart("v") }
          else { $version = (Get-Content package.json | ConvertFrom-Json).version }
          $meta = [ordered]@{
            version = $version
            asset = "GlassTicker.exe"
            size = $size
            sha256 = $hash
            repo = "shounakjoshi88-a11y/glass-ticker"
            url = "https://github.com/shounakjoshi88-a11y/glass-ticker/releases/latest/download/GlassTicker.exe"
          }
          $meta | ConvertTo-Json | Set-Content -Path "dist/release.json" -Encoding utf8
          "$hash  GlassTicker.exe" | Set-Content -Path "dist/GlassTicker.exe.sha256" -Encoding ascii
          Write-Output "version=$version sha256=$hash size=$size"
      - uses: actions/upload-artifact@v7
        with:
          name: GlassTicker
          path: |
            dist/GlassTicker.exe
            dist/release.json
            dist/GlassTicker.exe.sha256
          if-no-files-found: error
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/GlassTicker.exe
            dist/release.json
            dist/GlassTicker.exe.sha256
          draft: false
          generate_release_notes: true
