name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win
            os: windows-latest
            artifact_name: GlassTicker-windows
            artifact_path: dist/GlassTicker.exe
            release_files: |
              dist/GlassTicker.exe
              dist/release.json
              dist/GlassTicker.exe.sha256
          - platform: mac
            os: macos-latest
            artifact_name: GlassTicker-macos
            artifact_path: |
              dist/*.dmg
              dist/*.zip
            release_files: |
              dist/*.dmg
              dist/*.zip
          - platform: linux
            os: ubuntu-latest
            artifact_name: GlassTicker-linux
            artifact_path: |
              dist/*.AppImage
              dist/*.deb
            release_files: |
              dist/*.AppImage
              dist/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run dist:${{ matrix.platform }}

      - name: Compute release metadata
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $exe = "dist/GlassTicker.exe"
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          $size = (Get-Item $exe).Length
          $tag = "${{ github.ref_name }}"
          if ($tag -like "v*") { $version = $tag.TrimStart("v") }
          else { $version = (Get-Content package.json | ConvertFrom-Json).version }
          $meta = [ordered]@{
            version = $version
            asset = "GlassTicker.exe"
            size = $size
            sha256 = $hash
            repo = "shounakjoshi88-a11y/glass-ticker"
            url = "https://github.com/shounakjoshi88-a11y/glass-ticker/releases/latest/download/GlassTicker.exe"
          }
          $meta | ConvertTo-Json | Set-Content -Path "dist/release.json" -Encoding utf8
          "$hash  GlassTicker.exe" | Set-Content -Path "dist/GlassTicker.exe.sha256" -Encoding ascii
          Write-Output "version=$version sha256=$hash size=$size"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ matrix.release_files }}
          draft: false
          generate_release_notes: true
