name: publish packages
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  github-packages:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Publish the npm packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY: https://npm.pkg.github.com
          OWNER: ${{ github.repository_owner }}
          WORKSPACE: ${{ github.workspace }}
        run: |
          set -euo pipefail
          # The plugin packages ship under a scope because GitHub Packages
          # only accepts scoped npm names. The built files are committed, so
          # nothing has to be built here.
          for pkg in core react vue server glass-ticker; do
            if [ "$pkg" = "glass-ticker" ]; then
              work="$RUNNER_TEMP/npm-glass-ticker"
              mkdir -p "$work"
              cp -r "$WORKSPACE/packages/npm/glass-ticker/." "$work/"
            else
              work="$RUNNER_TEMP/npm-$pkg"
              rm -rf "$work"
              cp -r "$WORKSPACE/packages/$pkg" "$work"
            fi
            cd "$work"
            node -e "
              const fs = require('fs');
              const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
              if (pkg.name.startsWith('@')) {
                pkg.name = pkg.name.replace(/^@[^/]+\//, '@' + process.env.OWNER + '/');
              } else {
                pkg.name = '@' + process.env.OWNER + '/' + pkg.name;
              }
              pkg.publishConfig = { registry: process.env.REGISTRY, access: 'public' };
              fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
            "
            echo "//${REGISTRY#https://}:_authToken=${NODE_AUTH_TOKEN}" > .npmrc
            name="$(node -p "require('./package.json').name")"
            version="$(node -p "require('./package.json').version")"
            if npm view "${name}@${version}" --registry "$REGISTRY" >/dev/null 2>&1; then
              echo "${name}@${version} is already published - skipping"
            else
              npm publish --registry "$REGISTRY" --access public --ignore-scripts
            fi
          done

      - name: Publish the Maven artifact
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          set -uo pipefail
          cat > settings.xml <<EOF
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>${GITHUB_ACTOR}</username>
                <password>${GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF
          mvn --batch-mode --settings settings.xml deploy \
            -DaltDeploymentRepository="github::default::https://maven.pkg.github.com/${OWNER}/${REPO}" \
            > deploy.log 2>&1 || {
              if grep -qiE "already exists|status code: 409|Conflict" deploy.log; then
                echo "already published to GitHub Packages - skipping"
              else
                tail -40 deploy.log
                exit 1
              fi
            }

      - name: Make the packages public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -uo pipefail
          # GitHub Packages defaults to private. Flipping the visibility
          # needs a personal access token with the write:packages scope -
          # the built-in GITHUB_TOKEN is not allowed to change it. Set the
          # PACKAGES_TOKEN secret to automate it, otherwise it is a two
          # click job in the repository's Packages tab.
          for type in npm maven; do
            gh api --paginate "/users/${OWNER}/packages?package_type=${type}" \
              --jq '.[] | "(.package_type)\t(.name)\t(.visibility)"' || true
          done
          if [ -z "${PACKAGES_TOKEN}" ]; then
            echo "::notice::PACKAGES_TOKEN is not set, so the packages stay private."
            echo "::notice::Repository > Packages > package > Change visibility > Public."
            exit 0
          fi
          for type in npm maven; do
            gh api --paginate "/users/${OWNER}/packages?package_type=${type}" \
              --jq '.[].url' | while read -r url; do
                echo "patching ${url}"
                GH_TOKEN="${PACKAGES_TOKEN}" gh api --method PATCH "${url}" -f visibility=public \
                  --jq '"now: " + .visibility' || echo "could not change ${url}"
              done
          done

  public-registries:
    name: Publish to npmjs, PyPI and Maven Central
    runs-on: ubuntu-latest
    needs: github-packages
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      PYPI_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
      CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
    # Each step only runs when the matching secret has been added to the
    # repository, so this job is safe to enable before the accounts exist.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Publish to npmjs
        if: env.NPM_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}
        run: |
          set -euo pipefail
          for dir in packages/core packages/react packages/vue packages/server packages/npm/glass-ticker; do
            cd "$GITHUB_WORKSPACE/$dir"
            version="$(node -p "require('./package.json').version")"
            name="$(node -p "require('./package.json').name")"
            if npm view "${name}@${version}" --registry https://registry.npmjs.org >/dev/null 2>&1; then
              echo "${name}@${version} is already on npmjs - skipping"
            else
              npm publish --registry https://registry.npmjs.org --access public --ignore-scripts
            fi
          done

      - name: Publish to PyPI
        if: env.PYPI_PASSWORD != ''
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ env.PYPI_PASSWORD }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade build twine
          python -m build --outdir dist-python packages/python
          twine check dist-python/*
          twine upload --non-interactive --skip-existing dist-python/*

      - name: Publish to Maven Central
        if: env.CENTRAL_TOKEN != ''
        env:
          CENTRAL_TOKEN: ${{ env.CENTRAL_TOKEN }}
        run: |
          set -euo pipefail
          cat > settings.xml <<EOF
          <settings>
            <servers>
              <server>
                <id>central</id>
                <username>__token__</username>
                <password>${CENTRAL_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF
          mvn --batch-mode --settings settings.xml -Prelease deploy

  release-assets:
    name: Attach the packages to the release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # The registries need tokens, but the release does not: the same
      # tarballs, wheel and jar are attached to it, so `npm install` and
      # `pip install` can point straight at a release URL today.
      - name: Build the installable artefacts
        run: |
          set -euo pipefail
          mkdir -p dist-packages
          for dir in packages/core packages/react packages/vue packages/server packages/npm/glass-ticker; do
            (cd "$dir" && npm pack --pack-destination "$GITHUB_WORKSPACE/dist-packages")
          done
          python -m pip install --upgrade build
          python -m build --outdir dist-packages packages/python
          mkdir -p build/classes
          javac -encoding UTF-8 -d build/classes $(find src/main/java -name '*.java')
          version="$(node -p "require('./package.json').version")"
          jar --create --file "dist-packages/glass-ticker-launcher-${version}.jar" \
            --main-class com.github.shounakjoshi88.glassticker.Launcher \
            -C build/classes .
          ls -la dist-packages

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist-packages/*
          draft: false
