name: publish packages
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  github-packages:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Publish the npm package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY: https://npm.pkg.github.com
          SCOPED_NAME: "@${{ github.repository_owner }}/glass-ticker"
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/npm-package"
          cp -r packages/npm/glass-ticker "$work"
          cd "$work"
          # GitHub Packages only accepts scoped npm names.
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.name = process.env.SCOPED_NAME;
            pkg.publishConfig = { registry: process.env.REGISTRY, access: 'public' };
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "
          echo "//${REGISTRY#https://}:_authToken=${NODE_AUTH_TOKEN}" > .npmrc
          version="$(node -p "require('./package.json').version")"
          if npm view "${SCOPED_NAME}@${version}" --registry "$REGISTRY" >/dev/null 2>&1; then
            echo "npm ${SCOPED_NAME}@${version} is already published - skipping"
          else
            npm publish --registry "$REGISTRY" --access public
          fi

      - name: Publish the Maven artifact
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          set -uo pipefail
          cat > settings.xml <<EOF
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>${GITHUB_ACTOR}</username>
                <password>${GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF
          mvn --batch-mode --settings settings.xml deploy \
            -DaltDeploymentRepository="github::default::https://maven.pkg.github.com/${OWNER}/${REPO}" \
            > deploy.log 2>&1 || {
              if grep -qi "already exists" deploy.log; then
                echo "already published to GitHub Packages - skipping"
              else
                tail -40 deploy.log
                exit 1
              fi
            }

      - name: Make the packages public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -uo pipefail
          # GitHub Packages defaults to private - flip both to public so
          # anyone can install them without a token. The API hands back the
          # exact resource URL, so there is no name format to guess.
          for type in npm maven; do
            gh api --paginate "/users/${OWNER}/packages?package_type=${type}" \
              --jq '.[] | "(.package_type)\t(.name)\t(.visibility)\t(.url)"' || true
            gh api --paginate "/users/${OWNER}/packages?package_type=${type}" \
              --jq '.[].url' | while read -r url; do
                echo "patching ${url}"
                gh api --method PATCH "${url}" -f visibility=public \
                  --jq '"now: " + .visibility' || echo "could not change ${url}"
              done
          done

  public-registries:
    name: Publish to npmjs, PyPI and Maven Central
    runs-on: ubuntu-latest
    needs: github-packages
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      PYPI_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
      CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
    # Each step only runs when the matching secret has been added to the
    # repository, so this job is safe to enable before the accounts exist.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Publish to npmjs
        if: env.NPM_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}
        run: |
          set -euo pipefail
          cd packages/npm/glass-ticker
          version="$(node -p "require('./package.json').version")"
          if npm view "glass-ticker@${version}" --registry https://registry.npmjs.org >/dev/null 2>&1; then
            echo "glass-ticker@${version} is already on npmjs - skipping"
          else
            npm publish --registry https://registry.npmjs.org --access public
          fi

      - name: Publish to PyPI
        if: env.PYPI_PASSWORD != ''
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ env.PYPI_PASSWORD }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade build twine
          python -m build --outdir dist-python packages/python
          twine check dist-python/*
          twine upload --non-interactive --skip-existing dist-python/*

      - name: Publish to Maven Central
        if: env.CENTRAL_TOKEN != ''
        env:
          CENTRAL_TOKEN: ${{ env.CENTRAL_TOKEN }}
        run: |
          set -euo pipefail
          cat > settings.xml <<EOF
          <settings>
            <servers>
              <server>
                <id>central</id>
                <username>__token__</username>
                <password>${CENTRAL_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF
          mvn --batch-mode --settings settings.xml -Prelease deploy
