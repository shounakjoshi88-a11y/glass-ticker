name: publish packages
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  github-packages:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Publish the npm package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY: https://npm.pkg.github.com
          SCOPED_NAME: "@${{ github.repository_owner }}/glass-ticker"
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/npm-package"
          cp -r packages/npm/glass-ticker "$work"
          cd "$work"
          # GitHub Packages only accepts scoped npm names.
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.name = process.env.SCOPED_NAME;
            pkg.publishConfig = { registry: process.env.REGISTRY, access: 'public' };
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "
          echo "//${REGISTRY#https://}:_authToken=${NODE_AUTH_TOKEN}" > .npmrc
          npm publish --registry "$REGISTRY" --access public

      - name: Publish the Maven artifact
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          cat > settings.xml <<EOF
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>${GITHUB_ACTOR}</username>
                <password>${GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF
          mvn --batch-mode --settings settings.xml deploy \
            -DaltDeploymentRepository="github::default::https://maven.pkg.github.com/${OWNER}/${REPO}"

      - name: Make the packages public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          NPM_NAME: "${{ github.repository_owner }}/glass-ticker"
          MAVEN_NAME: "com.github.${{ github.repository_owner }}:glass-ticker-launcher"
        run: |
          set -uo pipefail
          # GitHub Packages defaults to private - flip both to public so
          # anyone can install them without a token.
          gh api --method PATCH "/users/${OWNER}/packages/npm/${NPM_NAME}" \
            -f visibility=public 2>&1 | tail -2 || echo "npm visibility unchanged"
          gh api --method PATCH "/users/${OWNER}/packages/maven/${MAVEN_NAME}" \
            -f visibility=public 2>&1 | tail -2 || echo "maven visibility unchanged"

      - name: Summarise
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          gh api "/users/${OWNER}/packages?package_type=maven,npm" \
            --jq '.[] | "\(.package_type)\t\(.name)\t\(.visibility)"' || true

  public-registries:
    name: Publish to npmjs, PyPI and Maven Central
    runs-on: ubuntu-latest
    needs: github-packages
    # Each step only runs when the matching secret has been added to the
    # repository, so this job is safe to enable before the accounts exist.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Publish to npmjs
        if: ${{ secrets.NPM_TOKEN != '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          cd packages/npm/glass-ticker
          npm publish --registry https://registry.npmjs.org --access public

      - name: Publish to PyPI
        if: ${{ secrets.PYPI_PASSWORD != '' }}
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade build twine
          python -m build --outdir dist-python packages/python
          twine check dist-python/*
          twine upload --non-interactive dist-python/*

      - name: Publish to Maven Central
        if: ${{ secrets.CENTRAL_TOKEN != '' }}
        env:
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
        run: |
          set -euo pipefail
          cat > settings.xml <<EOF
          <settings>
            <servers>
              <server>
                <id>central</id>
                <username>__token__</username>
                <password>${CENTRAL_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF
          mvn --batch-mode --settings settings.xml -Prelease deploy
