[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "glass-ticker"
version = "2.5.0"
description = "Glass Ticker - a frameless acrylic desktop market ticker for Windows"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Shounak" }]
keywords = ["glass-ticker", "stock", "ticker", "market", "watchlist", "quotes", "desktop", "windows"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: X11 Applications",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/shounakjoshi88-a11y/glass-ticker"
Repository = "https://github.com/shounakjoshi88-a11y/glass-ticker"
Issues = "https://github.com/shounakjoshi88-a11y/glass-ticker/issues"

[project.scripts]
glass-ticker = "glass_ticker.cli:main"
glassticker = "glass_ticker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
glass_ticker = ["py.typed"]
