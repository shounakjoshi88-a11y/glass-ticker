<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}:root{--g:#5eeaa8;--r:#ff7a6b;--mono:"JetBrains Mono","Cascadia Mono",Consolas,monospace}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font:12px Inter,"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;color:#ececee;-webkit-font-smoothing:antialiased}body{padding:7px;transition:opacity .3s}
.card{height:100%;border-radius:18px;background:#121315;border:1px solid rgba(255,255,255,.09);box-shadow:inset 0 1px rgba(255,255,255,.04);overflow:hidden;position:relative;display:flex;flex-direction:column}
.top{height:36px;display:flex;align-items:center;padding:0 8px 0 12px;gap:8px;-webkit-app-region:drag;cursor:move;flex:none}
.dot{width:6px;height:6px;border-radius:50%;background:var(--g);box-shadow:0 0 9px var(--g);animation:p 2s infinite}@keyframes p{50%{opacity:.35}}
.name{font-size:11.5px;font-weight:620;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.actions{display:flex;gap:2px;-webkit-app-region:no-drag}.actions button{border:0;background:none;color:#8b8f96;border-radius:7px;width:24px;height:24px;cursor:pointer;display:grid;place-items:center;transition:background .2s,color .2s}.actions button:hover{background:#232528;color:#fff}#close:hover{background:#e5484d}
svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round}
.body{padding:0 14px 10px;flex:1;display:flex;flex-direction:column;min-height:0}
.price{font:500 26px/1.1 var(--mono);letter-spacing:-.04em}.move{font:600 10.5px var(--mono);margin-top:5px;display:flex;align-items:center}
.up{color:var(--g)}.dn{color:var(--r)}.tri{width:8px;height:8px;fill:currentColor;stroke:none;margin-right:4px}.tri.d{transform:rotate(180deg)}
canvas{width:100%;flex:1;min-height:40px;display:block;margin-top:6px}
.foot{font:400 9px var(--mono);color:#5f636a;display:flex;justify-content:space-between;letter-spacing:.06em;text-transform:uppercase}
</style></head><body><div class="card"><div class="top"><i class="dot"></i><div class="name" id="name">Pinned stock</div><div class="actions"><button id="hide" title="Fade widget"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button><button id="close" title="Unpin"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div></div>
<div class="body"><div class="price" id="price">—</div><div class="move" id="move">Waiting for data</div><canvas id="chart" width="560" height="144"></canvas><div class="foot"><span id="symbol">Glass Ticker</span><span id="updated">live</span></div></div></div>
<script>
const $=s=>document.querySelector(s);const money=(v,c)=>{try{return new Intl.NumberFormat(undefined,{style:'currency',currency:c,maximumFractionDigits:2}).format(v)}catch{return Number(v).toFixed(2)}};
function draw(p){$('#name').textContent=p.name||p.symbol;$('#symbol').textContent=p.symbol;$('#price').textContent=money(p.price,p.currency);const up=p.change>=0;
$('#move').innerHTML=`<svg class="tri ${up?'':'d'}" viewBox="0 0 8 8"><path d="M4 1 7.5 6.5h-7z"/></svg>${money(Math.abs(p.change),p.currency)}  (${up?'+':''}${p.pct.toFixed(2)}%)`;$('#move').className='move '+(up?'up':'dn');
$('#updated').textContent=new Date(p.updated||Date.now()).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
const c=$('#chart'),r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;const x=c.getContext('2d'),W=c.width,H=c.height,a=p.points||[];x.clearRect(0,0,W,H);if(a.length<2)return;
const lo=Math.min(...a),hi=Math.max(...a),s=hi-lo||1,col=up?'#5eeaa8':'#ff7a6b',X=i=>6*d+i/(a.length-1)*(W-14*d),Y=v=>6*d+(hi-v)/s*(H-14*d);
const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,col+'44');g.addColorStop(1,col+'00');x.beginPath();a.forEach((v,i)=>i?x.lineTo(X(i),Y(v)):x.moveTo(X(i),Y(v)));x.lineTo(X(a.length-1),H);x.lineTo(X(0),H);x.fillStyle=g;x.fill();
x.beginPath();a.forEach((v,i)=>i?x.lineTo(X(i),Y(v)):x.moveTo(X(i),Y(v)));x.lineWidth=2*d;x.lineJoin='round';x.strokeStyle=col;x.stroke();x.beginPath();x.arc(X(a.length-1),Y(a[a.length-1]),3.2*d,0,7);x.fillStyle=col;x.fill()}
let mine=null;if(window.api?.onWidgetData)window.api.onWidgetData(p=>{if(!mine)mine=p.symbol;if(p.symbol===mine)draw(p)});$('#close').onclick=()=>window.api.closeWidget();$('#hide').onclick=()=>document.body.style.opacity=document.body.style.opacity==='0.25'?'1':'0.25';
</script></body></html>
