<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Segoe UI,Inter,Arial,sans-serif;color:#e9f0f7}body{padding:7px}.card{height:100%;border:1px solid #ffffff20;border-radius:17px;background:linear-gradient(145deg,rgba(18,25,35,.91),rgba(8,13,20,.86));backdrop-filter:blur(24px) saturate(145%);box-shadow:0 12px 38px #0008,inset 0 1px #ffffff12;overflow:hidden;position:relative}.top{height:34px;display:flex;align-items:center;padding:0 10px;gap:7px;-webkit-app-region:drag;cursor:move}.dot{width:7px;height:7px;border-radius:50%;background:#74d9b1;box-shadow:0 0 10px #74d9b188}.name{font-size:11px;font-weight:650;letter-spacing:.35px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}.actions{display:flex;gap:4px;-webkit-app-region:no-drag}.actions button{border:0;background:#ffffff0d;color:#aab8c8;border-radius:6px;width:22px;height:22px;cursor:pointer;font-size:13px}.actions button:hover{background:#ffffff22;color:white}.body{padding:2px 12px 10px}.price{font-size:23px;font-weight:650;letter-spacing:-.8px;line-height:1.2}.move{font-size:10px;margin-top:3px;font-weight:600}.up{color:#62ddb0}.dn{color:#ff8585}canvas{width:100%;height:72px;display:block;margin-top:4px}.foot{font-size:9px;color:#718093;display:flex;justify-content:space-between;margin-top:0}.hint{position:absolute;right:10px;bottom:8px;font-size:8px;color:#526274;opacity:.75}
</style></head><body><div class="card"><div class="top"><i class="dot"></i><div class="name" id="name">Pinned stock</div><div class="actions"><button id="hide" title="Hide widget">–</button><button id="close" title="Unpin and close">×</button></div></div><div class="body"><div class="price" id="price">—</div><div class="move" id="move">Waiting for market data</div><canvas id="chart" width="560" height="144"></canvas><div class="foot"><span id="symbol">GLASS TICKER</span><span id="updated">LIVE</span></div></div><div class="hint">drag top bar to move</div></div><script>
const $=s=>document.querySelector(s);let latest=null;function money(v,c){try{return new Intl.NumberFormat(undefined,{style:'currency',currency:c,maximumFractionDigits:2}).format(v)}catch{return Number(v).toFixed(2)}}function draw(p){latest=p;$('#name').textContent=p.name||p.symbol;$('#symbol').textContent=p.symbol;$('#price').textContent=money(p.price,p.currency);const up=p.change>=0;$('#move').textContent=(up?'▲ +':'▼ ')+money(Math.abs(p.change),p.currency)+'  ('+(up?'+':'')+p.pct.toFixed(2)+'%)';$('#move').className='move '+(up?'up':'dn');$('#updated').textContent='UPDATED '+new Date(p.updated||Date.now()).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});const c=$('#chart'),x=c.getContext('2d'),a=p.points||[];x.clearRect(0,0,c.width,c.height);if(a.length<2)return;const lo=Math.min(...a),hi=Math.max(...a),span=hi-lo||1,upColor=p.change>=0?'#62ddb0':'#ff8585';x.beginPath();a.forEach((v,i)=>{const xx=10+i/(a.length-1)*(c.width-20),yy=8+(hi-v)/span*(c.height-28);i?x.lineTo(xx,yy):x.moveTo(xx,yy)});x.lineWidth=3;x.strokeStyle=upColor;x.shadowColor=upColor;x.shadowBlur=12;x.stroke();x.shadowBlur=0;x.lineTo(c.width-10,c.height-10);x.lineTo(10,c.height-10);x.closePath();const g=x.createLinearGradient(0,0,0,c.height);g.addColorStop(0,upColor+'55');g.addColorStop(1,upColor+'00');x.fillStyle=g;x.fill()}
if(window.api?.onWidgetData)window.api.onWidgetData(draw);$('#close').onclick=()=>window.api.closeWidget();$('#hide').onclick=()=>document.body.style.opacity=document.body.style.opacity==='0.25'?'1':'0.25';
</script></body></html>
