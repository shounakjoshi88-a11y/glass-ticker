<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glass Ticker - component demo</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; padding: 28px; background: #08080a; color: #f2f2f3;
    font: 14px/1.5 "Inter", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  }
  h1 { font-size: 20px; margin: 0 0 4px; letter-spacing: -0.01em; }
  p.lede { margin: 0 0 22px; color: #8b8d96; font-size: 13px; }
  .bar { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
  button {
    padding: 6px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,.1);
    background: #141518; color: #cfd0d5; font: inherit; font-size: 12px; cursor: pointer;
  }
  button:hover { background: #1c1d21; color: #fff; }
  .frame { max-width: 980px; }
  .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); }
  glass-ticker { height: 420px; }
  code { background: #141518; padding: 2px 6px; border-radius: 5px; font-size: 12px; color: #5eeaa8; }
  #log { margin-top: 14px; font-size: 11px; color: #5c5e67; min-height: 16px; }
</style>
</head>
<body>
  <h1>Glass Ticker component</h1>
  <p class="lede">
    One custom element, no framework. Drop in
    <code>&lt;glass-ticker&gt;</code> and point it at a data endpoint.
  </p>

  <div class="bar">
    <button data-theme="carbon">carbon</button>
    <button data-theme="dark">dark</button>
    <button data-theme="light">light</button>
    <button data-theme="glass">glass</button>
    <button id="add">add BTC-USD</button>
  </div>

  <div class="frame">
    <div class="grid">
      <glass-ticker id="one" symbols="NVDA,AAPL,TSLA,MSFT,BTC-USD" symbol="NVDA" range="1D" theme="carbon"></glass-ticker>
      <glass-ticker id="two" symbols="^NSEI,RELIANCE.NS,TCS.NS,INFY.NS,HDFCBANK.NS" symbol="RELIANCE.NS" range="5D" theme="glass" height="300"></glass-ticker>
    </div>
  </div>
  <div id="log"></div>

  <script type="module" src="/packages/core/dist/glass-ticker.js"></script>
  <script>
    const log = document.getElementById('log');
    document.querySelectorAll('button[data-theme]').forEach((button) => {
      button.addEventListener('click', () => {
        document.querySelectorAll('glass-ticker').forEach((node) => {
          node.setAttribute('theme', button.dataset.theme);
        });
      });
    });
    document.getElementById('add').addEventListener('click', () => {
      const one = document.getElementById('one');
      const symbols = (one.getAttribute('symbols') || '').split(',');
      if (!symbols.includes('BTC-USD')) symbols.push('BTC-USD');
      one.setAttribute('symbols', symbols.join(','));
    });
    document.addEventListener('symbol-change', (event) => {
      log.textContent = 'symbol-change -> ' + event.detail.symbol;
    });
    document.addEventListener('error', (event) => {
      log.textContent = 'error -> ' + (event.detail?.error?.message || 'unknown');
    });
  </script>
</body>
</html>
